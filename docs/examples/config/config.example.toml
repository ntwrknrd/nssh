# nssh Configuration File
#
# Location: ~/.config/nssh/config.toml
#
# All settings are optional - nssh works without this file using sensible defaults.

# ============================================================================
# [agent]
# ============================================================================

[agent]

# Auto-start runtime agent on first provider-session request
# auto_start = true

# Idle timeout - terminate agent after inactivity (1s-24h)
# Env: NSSH_AGENT_IDLE_TIMEOUT
# idle_timeout = "1h"

# Activity increment - extend idle deadline on activity (1s-idle_timeout)
# Each activity adds this much to the current deadline, capped at idle_timeout from now
# Env: NSSH_AGENT_ACTIVITY_INCREMENT
# activity_increment = "15m"

# Max lifetime - hard cap regardless of activity (1m-168h)
# Env: NSSH_AGENT_MAX_LIFETIME
# max_lifetime = "24h"

# ============================================================================
# [credential]
# ============================================================================

[credential]

# Default provider used by inventory auth mappings that omit provider.
default_provider = "pass-local"

[credential.provider.pass-local]
type = "pass"

  [credential.provider.pass-local.config]
  command = "pass"
  prefix = "nssh"

# 1Password provider example.
# [credential.provider.op-network]
# type = "1password"
#
#   [credential.provider.op-network.config]
# account = ""
# vault = "Network"
# session = "agent"
#
# Bitwarden provider example.
# [credential.provider.bw-lab]
# type = "bitwarden"
#
#   [credential.provider.bw-lab.config]
# session = "external"
#
# ============================================================================
# [inventory]
# ============================================================================

[inventory]

# Default local inventory group for new hosts.
# default_group = "default"

# Local groups label hosts in the implicit provider_local.conf inventory.
[inventory.group.default]
# default_user = "netops"

  [inventory.group.default.auth]
  provider = "pass-local"
  ref = "nssh/groups/default"

# Host auth override example.
# [inventory.host.edge01.auth]
# provider = "pass-local"
# ref = "nssh/hosts/edge01"
# username = "netops"

# External inventory providers are configured here, not through CLI CRUD.
# [inventory.provider.netbox-prod]
# type = "netbox"
#
#   [inventory.provider.netbox-prod.config]
#   base_url = "https://netbox.example.com"
#   token_env = "NETBOX_TOKEN"
#
#   [[inventory.provider.netbox-prod.route]]
#   group = "default"
#   # Optional: "password" or "key". Defaults to password when the group has auth.
#   auth_mode = "password"

# ============================================================================
# [logging.audit]
# ============================================================================

[logging.audit]

# Enable security event logging to ~/.local/state/nssh/audit.log
# enabled = true

# Maximum backup files to retain for SSH config and credentials (1-100, 0=unlimited)
# max_backup_files = 10

# Max audit log size before rotation (supports KB, MB, GB suffixes)
# max_size = "10MB"

# ============================================================================
# [logging.session]
# ============================================================================

[logging.session]

# Enable automatic session recording
# enabled = false

# Append to daily session file vs creating separate files per session
# append_mode = true

# Recording storage directory (~ expansion supported)
# dir = "~/.local/state/nssh/casts"

# Custom asciinema server URL (used by `nssh log upload` and `nssh log auth`)
# asciinema_server_url = "https://asciinema.org"

# Exclude patterns: never record matching hosts (glob or regex:... prefix)
# Only used if include_hosts is empty
# exclude_hosts = ["prod-*", "*.production.com", "regex:.*-mgmt$"]

# Include patterns: only record matching hosts (glob or regex:... prefix)
# Takes precedence over exclude_hosts
# include_hosts = ["lab-*", "dev-*", "regex:^staging-.*"]

# Cap long pauses in recordings, in seconds (0=disabled)
# idle_time_limit = 0

# When to apply idle time limit: "play", "record", or "both"
# idle_time_limit_mode = "play"

# Title format template: {host}, {user}, {date}, {time}
# title_format = "nssh:{host}"

# Fixed terminal dimensions for recordings (cols x rows)
# window_size = "100x30"

# Automatically export recordings to plain text (.txt) when session ends
# auto_export_txt = false

# ============================================================================
# [logging.session.archive]
# ============================================================================

[logging.session.archive]

# Enable automatic archival of old session recordings
# enabled = false

# Archive storage directory for monthly bundles (~ expansion supported)
# dir = "~/.local/state/nssh/archives"

# Jitter for daily archive schedule to prevent thundering herd
# jitter = "30m"

# Maximum monthly archive bundles to retain
# max_bundles = 12

# Maximum bytes to process per maintenance run (0=unlimited)
# max_run_bytes = 0

# Minimum age before a recording is eligible for archival
# min_age = "30d"

# ============================================================================
# [ssh.connection]
# ============================================================================

[ssh.connection]

# Connection idle timeout (0=disabled)
# idle_timeout = "0"

# Password prompt timeout
# password_timeout = "10s"

# SSH connection timeout
# timeout = "30s"

# ============================================================================
# [ssh.security]
# ============================================================================

[ssh.security]

# Accept-once behavior: "pin" or "accept-new" (overrides host_key_policy)
# Env: NSSH_ACCEPT_ONCE_MODE
# accept_once_mode = "pin"

# Allow compatibility probes to write to real known_hosts
# compat_persist_probes = false

# Host key policy preset: "pin" or "tofu"
#   pin: Accept-once pins fingerprint, probes use temp known_hosts
#   tofu: Accept-once uses accept-new, probes persist to real known_hosts
# Env: NSSH_HOST_KEY_POLICY
# host_key_policy = "pin"
