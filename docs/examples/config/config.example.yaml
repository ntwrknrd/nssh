# nssh Configuration File
# Location: ~/.config/nssh/config.yaml

include: [credential/*.yaml, inventory/*.yaml]

agent:
  auto_start: true
  idle_timeout: 1h
  activity_increment: 15m
  max_lifetime: 24h

credential:
  provider:
    pass:
      type: pass
      session: external
      command: pass
      prefix: nssh

inventory:
  providers:
    local:
      type: local
      groups:
        default:
          auth:
            mode: password
            credential_provider: pass
            password_ref: nssh/groups/default
            username: netops
      hosts: {}

ssh:
  connection:
    timeout: 30s
    password_timeout: 10s
    idle_timeout: 0s
  security:
    host_key_policy: pin
    accept_once_mode: pin
    compat_persist_probes: false

logging:
  audit:
    enabled: true
    max_size: 10MB
  export:
    gif:
      window_size: 145x30
      font_size: 18
  session:
    enabled: false
    append_mode: true
    dir: ~/.local/state/nssh/casts
    auto_export_txt: true
