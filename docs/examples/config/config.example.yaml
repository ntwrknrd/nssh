# nssh Configuration File
# Location: ~/.config/nssh/config.yaml

include: [credential/*.yaml, inventory/*.yaml]

agent:
  auto_start: true
  idle_timeout: 1h
  activity_increment: 15m
  max_lifetime: 24h
  provider_request_timeout: 2m

credential:
  provider:
    sops:
      type: sops-age
      file: ~/.local/share/nssh/credentials.sops.yaml
    op-expedient:
      type: 1password
      vault: Expedient
      keepalive: false
      keepalive_interval: 5m
      keepalive_timeout: 10s
    bw-work:
      type: bitwarden
      warm_session: false

inventory:
  providers:
    local:
      type: local
      groups:
        default: {}
      hosts: {}

ssh:
  connection:
    timeout: 30s
    password_timeout: 10s
    idle_timeout: 0s
  security:
    host_key_policy: pin
    accept_once_mode: pin
    compat_persist_probes: false

logging:
  audit:
    enabled: true
    max_size: 10MB
  export:
    gif:
      window_size: 145x30
      font_size: 18
  session:
    enabled: false
    append_mode: true
    dir: ~/.local/state/nssh/casts
    auto_export_txt: true
    archive:
      dir: ~/.local/state/nssh/archives
      min_age: 720h
      max_bundles: 12
      max_run_bytes: 0
      timeout: 30s
