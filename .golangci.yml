version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - gocritic
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - commentFormatting
        - hugeParam
      settings:
        rangeValCopy:
          # The config and CLI loops iterate 144-272 byte structs on cold
          # paths, where the copy costs nothing. Keep the check for structs
          # large enough to matter.
          sizeThreshold: 512
    misspell:
      locale: US
  exclusions:
    rules:
      # Allow unused parameters in test files
      - path: _test\.go
        linters:
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
