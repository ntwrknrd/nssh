name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify Linux in the shared container
        if: runner.os == 'Linux'
        run: make container-test

      - uses: actions/setup-go@v6
        if: runner.os == 'macOS'
        with:
          go-version-file: .go-version

      - name: Verify native macOS
        if: runner.os == 'macOS'
        run: make check
