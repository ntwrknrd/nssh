name: Build

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ====================
  # CI Jobs (always run)
  # ====================

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Build (pure Go)
        run: |
          go build -trimpath -ldflags "-s -w" -o nssh ./cmd/nssh
      - name: Verify no hardware features
        run: |
          ./nssh -V
          ! ./nssh -V | grep -q "piv"

  build-hardware-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Install PC/SC dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: Build with hardware
        env:
          CGO_ENABLED: 1
        run: |
          go build -trimpath -tags hardware -ldflags "-s -w" -o nssh-hardware ./cmd/nssh
      - name: Verify PIV available
        run: ./nssh-hardware -V | grep -q "piv"

  build-hardware-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Build with hardware
        env:
          CGO_ENABLED: 1
        run: |
          go build -trimpath -tags hardware -ldflags "-s -w" -o nssh-hardware ./cmd/nssh
      - name: Verify PIV available
        run: ./nssh-hardware -V | grep -q "piv"

  # ==========================
  # Release Jobs (tags only)
  # ==========================

  release-pure:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" \
            -o dist/nssh ./cmd/nssh
          cd dist
          tar -czf nssh_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz nssh
          rm nssh
      - uses: actions/upload-artifact@v4
        with:
          name: nssh-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz

  release-hardware-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Install PC/SC dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p dist
          go build -trimpath -tags hardware \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" \
            -o dist/nssh-hardware ./cmd/nssh
          cd dist
          tar -czf nssh-hardware_${VERSION}_linux_amd64.tar.gz nssh-hardware
          rm nssh-hardware
      - uses: actions/upload-artifact@v4
        with:
          name: nssh-hardware-linux-amd64
          path: dist/*.tar.gz

  release-hardware-darwin-amd64:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false  # Workaround for macos-15-intel tar cache issue
      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p dist
          go build -trimpath -tags hardware \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" \
            -o dist/nssh-hardware ./cmd/nssh
          cd dist
          tar -czf nssh-hardware_${VERSION}_darwin_amd64.tar.gz nssh-hardware
          rm nssh-hardware
      - uses: actions/upload-artifact@v4
        with:
          name: nssh-hardware-darwin-amd64
          path: dist/*.tar.gz

  release-hardware-darwin-arm64:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p dist
          go build -trimpath -tags hardware \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" \
            -o dist/nssh-hardware ./cmd/nssh
          cd dist
          tar -czf nssh-hardware_${VERSION}_darwin_arm64.tar.gz nssh-hardware
          rm nssh-hardware
      - uses: actions/upload-artifact@v4
        with:
          name: nssh-hardware-darwin-arm64
          path: dist/*.tar.gz

  release-create:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - release-pure
      - release-hardware-linux
      - release-hardware-darwin-amd64
      - release-hardware-darwin-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: nssh-*
          merge-multiple: true
          path: dist/
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create release if it doesn't exist
          if ! gh release view ${{ github.ref_name }} &>/dev/null; then
            gh release create ${{ github.ref_name }} \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi
          # Upload assets (overwrites existing)
          gh release upload ${{ github.ref_name }} \
            dist/*.tar.gz \
            dist/checksums.txt \
            --clobber

  homebrew-nssh:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-create
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nssh-*
          merge-multiple: true
          path: dist/
      - name: Calculate checksums
        id: checksums
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "darwin_amd64=$(sha256sum dist/nssh_${VERSION}_darwin_amd64.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "darwin_arm64=$(sha256sum dist/nssh_${VERSION}_darwin_arm64.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "linux_amd64=$(sha256sum dist/nssh_${VERSION}_linux_amd64.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "linux_arm64=$(sha256sum dist/nssh_${VERSION}_linux_arm64.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
      - name: Update homebrew tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.checksums.outputs.version }}

          git clone https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/ntwrknrd/homebrew-nssh.git tap
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p Formula
          cat > Formula/nssh.rb << 'EOF'
          class Nssh < Formula
            desc "SSH wrapper with credential management and session recording"
            homepage "https://github.com/ntwrknrd/nssh"
            license "GPL-3.0-only"
            version "VERSION_PLACEHOLDER"

            on_macos do
              on_intel do
                url "https://github.com/ntwrknrd/nssh/releases/download/vVERSION_PLACEHOLDER/nssh_VERSION_PLACEHOLDER_darwin_amd64.tar.gz"
                sha256 "SHA_DARWIN_AMD64"
              end
              on_arm do
                url "https://github.com/ntwrknrd/nssh/releases/download/vVERSION_PLACEHOLDER/nssh_VERSION_PLACEHOLDER_darwin_arm64.tar.gz"
                sha256 "SHA_DARWIN_ARM64"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/ntwrknrd/nssh/releases/download/vVERSION_PLACEHOLDER/nssh_VERSION_PLACEHOLDER_linux_amd64.tar.gz"
                sha256 "SHA_LINUX_AMD64"
              end
              on_arm do
                url "https://github.com/ntwrknrd/nssh/releases/download/vVERSION_PLACEHOLDER/nssh_VERSION_PLACEHOLDER_linux_arm64.tar.gz"
                sha256 "SHA_LINUX_ARM64"
              end
            end

            def install
              bin.install "nssh"
            end

            test do
              system "#{bin}/nssh", "-V"
            end
          end
          EOF

          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" Formula/nssh.rb
          sed -i "s/SHA_DARWIN_AMD64/${{ steps.checksums.outputs.darwin_amd64 }}/g" Formula/nssh.rb
          sed -i "s/SHA_DARWIN_ARM64/${{ steps.checksums.outputs.darwin_arm64 }}/g" Formula/nssh.rb
          sed -i "s/SHA_LINUX_AMD64/${{ steps.checksums.outputs.linux_amd64 }}/g" Formula/nssh.rb
          sed -i "s/SHA_LINUX_ARM64/${{ steps.checksums.outputs.linux_arm64 }}/g" Formula/nssh.rb

          git add Formula/nssh.rb
          git commit -m "Update nssh to ${VERSION}"
          git push
