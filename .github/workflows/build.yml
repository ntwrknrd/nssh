name: Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify with the shared Linux container
        run: make container-test

  # ==========================
  # Release Jobs (tags only)
  # ==========================

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist
          make build OUTPUT_DIR=dist VERSION="$VERSION" BUILDFLAGS=-trimpath
          cd dist
          tar -czf nssh_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz nssh nssh-askpass
          rm nssh nssh-askpass
      - uses: actions/upload-artifact@v4
        with:
          name: nssh-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz

  release-create:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: nssh-*
          merge-multiple: true
          path: dist/
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A hyphen in the tag marks a prerelease, e.g. v0.3.0-rc.1.
          PRERELEASE=""
          case "${{ github.ref_name }}" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          # Create release if it doesn't exist
          if ! gh release view ${{ github.ref_name }} &>/dev/null; then
            gh release create ${{ github.ref_name }} \
              --title "${{ github.ref_name }}" \
              --generate-notes ${PRERELEASE}
          fi
          # Upload assets (overwrites existing)
          gh release upload ${{ github.ref_name }} \
            dist/*.tar.gz \
            dist/checksums.txt \
            --clobber
