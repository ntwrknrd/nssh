ssh:
  connection:
    timeout: 30s
    password_timeout: 10s
    # 0s disables idle disconnects.
    idle_timeout: 0s
  security:
    host_key_policy: pin
    accept_once_mode: pin
    compat_persist_probes: false
  # defaults:
  #   options:
  #     ServerAliveInterval: 30
  #     ServerAliveCountMax: 3

logging:
  audit:
    enabled: true
    max_size: 10MB
  export:
    gif:
      window_size: 145x30
      font_size: 18
  session:
    enabled: false
    append_mode: true
    dir: ~/.local/state/nssh/casts
    auto_export_txt: true
    # exclude_hosts: []
    # include_hosts: []
    archive:
      dir: ~/.local/state/nssh/archives
      min_age: 720h
      max_bundles: 12
      max_run_bytes: 0
      timeout: 30s
