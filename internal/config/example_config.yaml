# nssh Configuration File
# Location: ~/.config/nssh/config.yaml
#
# This file is intentionally verbose: active lines are safe defaults, while
# commented lines show common options you can enable or tune later.

# Provider definitions live in include files created by `nssh self init`.
# These globs are activated only after matching files exist.
# include:
#   - credential/*.yaml
#   - inventory/*.yaml

agent:
  # The agent starts only when a selected credential transport needs retained
  # provider access, such as 1Password keepalive or Bitwarden warm_session.
  auto_start: true
  idle_timeout: 1h
  activity_increment: 15m
  max_lifetime: 24h
  provider_request_timeout: 2m

# Provider examples are intentionally commented. Run one of these commands to
# create an active provider file under ~/.config/nssh/credential/:
#
#   nssh self init --cred sops-age
#   nssh self init --cred 1password
#   nssh self init --cred bitwarden
#
# credential:
#   provider:
#     sops:
#       type: sops-age
#       file: ~/.local/share/nssh/credentials.sops.yaml
#       age_key_file: ~/.config/sops/age/keys.txt
#     op-work:
#       type: 1password
#       account: account-user-id
#       vault: Work
#       keepalive: true
#       keepalive_interval: 5m
#       keepalive_timeout: 10s
#     op-personal:
#       type: 1password
#       vault: Personal
#     bw-work:
#       type: bitwarden
#       warm_session: true

